vich_uploader:
    db_driver: orm
    mappings:
        offer_images:
            uri_prefix: /uploads/offers
            upload_destination: '%kernel.project_dir%/public/uploads/offers'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        user_avatars:
            uri_prefix: /uploads/avatars
            upload_destination: '%kernel.project_dir%/public/uploads/avatars'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
